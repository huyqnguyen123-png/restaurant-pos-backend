# ===== Thông tin kết nối PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_pos
spring.datasource.username=pos_admin
spring.datasource.password=Huy171102
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3

# ===== Cấu hình JPA/Hibernate =====
# update: tự động tạo/cập nhật bảng dựa theo Entity, phù hợp giai đoạn phát triển
spring.jpa.hibernate.ddl-auto=update

# In ra câu lệnh SQL trong console để dễ debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect cho PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Cổng chạy server (mặc định 8080, để rõ ràng) =====
server.port=${PORT:8080}